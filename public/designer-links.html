<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デザイナーリンク管理 - Production Management</title>
  <!-- 3画面で同一だった .link-url / .status-pill / .base-warning 等は main.css に集約済み -->
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="app-container">
    <!-- ヘッダー(ナビゲーションの中身は js/ui.js が data-nav を見て生成する) -->
    <header class="app-header">
      <div class="header-content">
        <div>
          <h1 class="app-title">🎨 デザイナーリンク管理</h1>
          <p class="app-subtitle">Designer Schedule Links</p>
        </div>
      </div>
      <nav class="header-buttons" data-nav="designer-links" aria-label="画面の切り替え"></nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="main-content">
      <section>
        <div class="list-controls">
          <button class="btn btn-primary" onclick="designerLinksApp.openModal()">➕ 新規リンク発行</button>
          <p class="empty-notice">発行したURLをデザイン担当者に共有すると、担当者が社外から自分のスケジュールボード(担当の準備項目)を確認・調整できます。予定の移動・完了操作・稼働申告は本人の担当分に限定されます。<br>また、<b>社内デザイン案件の準備項目は、有効なリンクの担当者へ自動で割り当てられます</b>(複数リンクがある場合は最初に発行されたリンクの担当者)。</p>
        </div>

        <!-- 配布URLの基準アドレスが未設定のときだけ表示(designer-links.js が制御) -->
        <div id="base-warning" class="base-warning" style="display:none" role="alert"></div>

        <div class="table-container">
          <table class="projects-table" id="links-table">
            <thead>
              <tr>
                <th>担当者</th>
                <th>専用URL</th>
                <th>状態</th>
                <th>発行日</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="links-tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- ===== モーダル: リンク発行 ===== -->
  <div id="link-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>新規リンク発行</h2>
        <button class="btn-close" onclick="designerLinksApp.closeModal()" aria-label="閉じる">✕</button>
      </div>
      <form id="link-form" class="project-form">
        <div class="form-group">
          <label for="link-employee-id">担当者(従業員) <span class="req-mark" aria-hidden="true">*</span> <span class="field-hint">(先に従業員マスタで登録してください)</span></label>
          <select id="link-employee-id" required>
            <option value="">選択してください</option>
          </select>
        </div>
        <div class="form-group">
          <label for="link-memo">メモ <span class="field-hint">(社内用。本人には表示されません)</span></label>
          <input type="text" id="link-memo" maxlength="500" placeholder="例: リモートデザイン担当">
        </div>

        <div class="form-errors" id="link-form-errors" hidden role="alert"></div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="designerLinksApp.closeModal()">キャンセル</button>
          <button type="submit" class="btn btn-primary">発行</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/designer-links.js"></script>
</body>
</html>
