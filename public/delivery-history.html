<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>納品履歴 - Production Management</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="app-container">
    <!-- ヘッダー(ナビゲーションの中身は js/ui.js が data-nav を見て生成する) -->
    <header class="app-header">
      <div class="header-content">
        <div>
          <h1 class="app-title">📦 納品履歴</h1>
          <p class="app-subtitle">Delivery History</p>
        </div>
      </div>
      <nav class="header-buttons" data-nav="delivery-history" aria-label="画面の切り替え"></nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="main-content">
      <section id="delivery-history-section">
        <!-- 過去案件検索 -->
        <div class="delivery-search-bar">
          <label for="delivery-search" class="sr-only">顧客名・案件名で検索</label>
          <input type="search" id="delivery-search" placeholder="🔍 顧客名・案件名で検索(全期間)">
          <span id="delivery-search-count" class="delivery-search-count"></span>
          <label class="checkbox-pill">
            <input type="checkbox" id="delivery-unsaved-only"> 📎 指示書PDF未保存だけ <span id="delivery-unsaved-count" class="delivery-unsaved-count"></span>
          </label>
          <button type="button" class="btn btn-secondary btn-small" id="delivery-inbox-scan" title="共有ドライブの「_指示書受信箱」にあるPDFを、今すぐ案件フォルダへ振り分けます(通常は5分ごとに自動)">📥 受信箱を今すぐ振り分け</button>
        </div>

        <div class="table-container">
          <table class="projects-table" id="delivery-history-table">
            <thead>
              <tr>
                <th>案件名</th>
                <th>顧客名</th>
                <th>加工</th>
                <th>数量</th>
                <th>納品日</th>
                <th>発送方法</th>
                <th>納品者</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="delivery-history-tbody">
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- リピート注文(複製)モーダル -->
  <div id="duplicate-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>↻ この案件をもとに新規作成</h2>
        <button class="btn-close" onclick="deliveryHistoryApp.closeDuplicateModal()" aria-label="閉じる">✕</button>
      </div>
      <form id="duplicate-form" class="project-form">
        <p class="empty-notice" id="duplicate-source-info"></p>
        <div class="form-group">
          <label for="dup-project-name">案件名 <span class="req-mark" aria-hidden="true">*</span></label>
          <input type="text" id="dup-project-name" name="project_name" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="dup-deadline">納期 <span class="req-mark" aria-hidden="true">*</span></label>
            <input type="date" id="dup-deadline" name="deadline" required>
          </div>
          <div class="form-group">
            <label for="dup-quantity">数量 <span class="req-mark" aria-hidden="true">*</span></label>
            <input type="number" id="dup-quantity" name="quantity" min="1" required>
          </div>
        </div>
        <p class="empty-notice">顧客名・加工内容・プリント箇所・共有ドライブのデザインフォルダは元の案件から引き継がれます。担当者と作業計画は引き継がないため、登録後にHiBoardの画面で設定してください。</p>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="deliveryHistoryApp.closeDuplicateModal()">キャンセル</button>
          <button type="submit" class="btn btn-primary">複製して登録</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 指示書PDFの後入れモーダル(「後で保存する」で納品した案件用) -->
  <div id="instruction-pdf-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📎 指示書PDFを案件フォルダに保存</h2>
        <button class="btn-close" onclick="deliveryHistoryApp.closeInstructionPdfModal()" aria-label="閉じる">✕</button>
      </div>
      <div class="project-form">
        <p class="empty-notice" id="instruction-pdf-source-info"></p>
        <div class="form-group">
          <div class="form-label">指示書PDF(GoodNotes)</div>
          <div id="history-pdf-picker"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="deliveryHistoryApp.closeInstructionPdfModal()">閉じる</button>
          <button type="button" class="btn btn-primary" id="instruction-pdf-save" onclick="deliveryHistoryApp.submitInstructionPdf()">保存する</button>
        </div>
      </div>
    </div>
  </div>

  <!-- スクリプト -->
  <script src="js/ui.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nas-browse.js"></script>
  <script src="js/case-detail.js"></script>
  <script src="js/instruction-pdf.js"></script>
  <script src="js/delivery-history.js"></script>
</body>
</html>
