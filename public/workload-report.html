<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>業務量レポート - Production Management</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    /* この画面だけの表示。色・余白・角丸は tokens.css の値を使う */

    .wl-section-title { font-size: var(--text-lg); font-weight: 600; color: var(--text-color); margin: var(--space-6) 0 var(--space-3); }

    .wl-controls { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: flex-end; margin-bottom: var(--space-5); }
    .wl-field { display: flex; flex-direction: column; gap: var(--space-1); }
    .wl-field .form-label { margin: 0; }
    .wl-field select, .wl-field input {
      padding: var(--space-2) var(--space-3); border: 1px solid var(--border-strong);
      border-radius: var(--radius-md); font-size: var(--text-base); font-family: inherit; background: var(--surface);
    }
    .wl-presets { display: flex; gap: var(--space-2); flex-wrap: wrap; }

    /* サマリーのカード */
    .wl-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-3); margin-bottom: var(--space-5); }
    .wl-card {
      background: var(--surface); border: 1px solid var(--border-color); border-radius: var(--radius-xl);
      padding: var(--space-4); box-shadow: var(--shadow-sm);
    }
    .wl-card-label { font-size: var(--text-xs); color: var(--text-muted); margin-bottom: var(--space-1); }
    .wl-card-value { font-size: var(--text-2xl); font-weight: 700; color: var(--text-color); line-height: 1.2; }
    .wl-card-note { font-size: var(--text-2xs); color: var(--text-muted); margin-top: var(--space-1); }
    .wl-card.is-warn { border-color: var(--warning-color); background: var(--warning-soft); }
    .wl-card.is-warn .wl-card-value { color: var(--warning-text); }
    .wl-card.is-good { border-color: var(--success-color); background: var(--success-soft); }
    .wl-card.is-good .wl-card-value { color: var(--success-text); }

    /* 読み方の説明。数字の意味が分からないと判断を誤るので画面に置く */
    .wl-legend {
      background: var(--surface-muted); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      padding: var(--space-3) var(--space-4); margin-bottom: var(--space-5);
      font-size: var(--text-xs); color: var(--text-subtle); line-height: var(--leading-relaxed);
    }
    .wl-legend dt { font-weight: 700; color: var(--text-color); display: inline; }
    .wl-legend dd { display: inline; margin: 0 var(--space-4) 0 var(--space-1); }
    .wl-legend dd::after { content: ''; display: block; }

    /* 日別テーブル */
    .wl-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
    .wl-table th, .wl-table td {
      padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border-color); text-align: right; white-space: nowrap;
    }
    .wl-table th { background: var(--surface-sunken); color: var(--text-subtle); font-size: var(--text-xs); font-weight: 700; }
    .wl-table th:first-child, .wl-table td:first-child { text-align: left; }
    .wl-table tr.is-day-off td { color: var(--text-muted); background: var(--surface-muted); }
    .wl-table tr.is-future td { color: var(--text-muted); }
    .wl-table tr.is-today td { background: var(--primary-soft); }
    .wl-num-zero { color: var(--gray-300); }
    .wl-carried { color: var(--pink-text); font-weight: 700; }

    /* 消化率のバー。数字だけだと日ごとの差が読み取りにくい */
    .wl-bar { display: flex; align-items: center; gap: var(--space-2); justify-content: flex-end; }
    .wl-bar-track { width: 70px; height: 8px; background: var(--gray-200); border-radius: var(--radius-pill); overflow: hidden; flex: none; }
    .wl-bar-fill { height: 100%; border-radius: var(--radius-pill); background: var(--success-color); }
    .wl-bar-fill.is-low { background: var(--danger-color); }
    .wl-bar-fill.is-mid { background: var(--warning-color); }
    .wl-rate { min-width: 40px; text-align: right; font-weight: 700; }

    /* 持ち越しの多いタスク */
    .wl-task-list { display: flex; flex-direction: column; gap: var(--space-2); }
    .wl-task {
      background: var(--surface); border: 1px solid var(--border-color); border-left: 4px solid var(--pink-text);
      border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4);
    }
    .wl-task-head { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
    /* 本人が書いたひとことメモ。何に時間を取られたのかはここにしか書かれていない */
    .wl-task-notes {
      margin-top: var(--space-2); padding-top: var(--space-2); border-top: 1px dashed var(--border-color);
      display: flex; flex-direction: column; gap: var(--space-1);
    }
    .wl-task-note { font-size: var(--text-sm); color: var(--text-subtle); line-height: var(--leading-normal); }
    .wl-note-date {
      display: inline-block; font-size: var(--text-2xs); font-weight: 700; color: var(--pink-text);
      background: var(--pink-soft); border-radius: var(--radius-pill); padding: 1px var(--space-2); margin-right: var(--space-1);
    }
    .wl-task.is-done { border-left-color: var(--gray-300); }
    .wl-task-count {
      font-size: var(--text-xs); font-weight: 700; padding: 2px 10px; border-radius: var(--radius-pill);
      background: var(--pink-soft); color: var(--pink-text); white-space: nowrap; flex: none;
    }
    .wl-task.is-done .wl-task-count { background: var(--surface-sunken); color: var(--text-muted); }
    .wl-task-name { flex: 1 1 240px; min-width: 0; font-weight: 600; font-size: var(--text-base); }
    .wl-task-meta { font-size: var(--text-xs); color: var(--text-muted); }

    /* 持ち越しの理由の内訳 */
    .wl-reasons { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
    .wl-reason {
      font-size: var(--text-xs); padding: var(--space-1) var(--space-3); border-radius: var(--radius-pill);
      background: var(--surface-sunken); color: var(--text-subtle); border: 1px solid var(--border-color);
    }
    .wl-reason strong { color: var(--text-color); }

    @media (max-width: 767px) {
      .wl-table th, .wl-table td { padding: var(--space-2); }
      /* 幅の狭い端末では件数列を省いて時間だけ見せる(横スクロールを出さない) */
      .wl-table .wl-col-count { display: none; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- ヘッダー(ナビゲーションの中身は js/ui.js が data-nav を見て生成する) -->
    <header class="app-header">
      <div class="header-content">
        <div>
          <h1 class="app-title">📊 業務量レポート</h1>
          <p class="app-subtitle">Workload Report</p>
        </div>
      </div>
      <nav class="header-buttons" data-nav="workload" aria-label="画面の切り替え"></nav>
    </header>

    <main class="main-content">
      <section>
        <div class="wl-controls">
          <div class="wl-field">
            <span class="form-label">対象者</span>
            <select id="employee-select" onchange="workloadApp.load()"></select>
          </div>
          <div class="wl-field">
            <span class="form-label">開始日</span>
            <input type="date" id="start-input" onchange="workloadApp.load()">
          </div>
          <div class="wl-field">
            <span class="form-label">終了日</span>
            <input type="date" id="end-input" onchange="workloadApp.load()">
          </div>
          <div class="wl-presets">
            <button class="btn btn-secondary btn-small" onclick="workloadApp.setPreset('this-week')">今週</button>
            <button class="btn btn-secondary btn-small" onclick="workloadApp.setPreset('last-week')">先週</button>
            <button class="btn btn-secondary btn-small" onclick="workloadApp.setPreset('this-month')">今月</button>
            <button class="btn btn-secondary btn-small" onclick="workloadApp.setPreset('last-30')">直近30日</button>
          </div>
        </div>

        <div id="loading" class="folder-loading">読み込み中...</div>
        <div id="report" style="display:none;">
          <div class="wl-summary" id="summary"></div>

          <dl class="wl-legend">
            <dt>計画</dt><dd>その日にやる予定だった合計時間（後日へ動かした分も、動かす前の姿に戻して数えます）</dd>
            <dt>完了</dt><dd>そのうち実際に終わった分</dd>
            <dt>持ち越し</dt><dd>その日から後ろへ動かした分</dd>
            <dt>未消化</dt><dd>その日に置かれたまま、まだ終わっていない分</dd>
            <dt>消化率</dt><dd>完了 ÷ 計画。低い日が続くなら1日の業務量が多すぎるか、見込み時間が短すぎます</dd>
          </dl>

          <h2 class="wl-section-title">日別</h2>
          <div class="table-container">
            <table class="wl-table">
              <thead>
                <tr>
                  <th>日付</th>
                  <th>稼働</th>
                  <th>計画</th>
                  <th>完了</th>
                  <th>持ち越し</th>
                  <th>未消化</th>
                  <th class="wl-col-count">件数</th>
                  <th>消化率</th>
                </tr>
              </thead>
              <tbody id="days-tbody"></tbody>
            </table>
          </div>
          <p class="empty-notice" id="unknown-note" style="display:none;"></p>

          <h2 class="wl-section-title">何度も持ち越しているタスク</h2>
          <div class="wl-task-list" id="task-list"></div>
          <p class="empty-notice" id="task-empty" style="display:none;">この期間に持ち越されたタスクはありません。</p>
          <div class="wl-reasons" id="reason-breakdown"></div>
        </div>
        <div id="error-box" class="empty-notice" style="display:none;"></div>
      </section>
    </main>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/workload-report.js"></script>
</body>
</html>
