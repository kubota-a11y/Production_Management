<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>取引先リンク管理 - Production Management</title>
  <!-- 3画面で同一だった .link-url / .status-pill / .base-warning 等は main.css に集約済み -->
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="app-container">
    <!-- ヘッダー(ナビゲーションの中身は js/ui.js が data-nav を見て生成する) -->
    <header class="app-header">
      <div class="header-content">
        <div>
          <h1 class="app-title">🤝 取引先リンク管理</h1>
          <p class="app-subtitle">Partner Status Links</p>
        </div>
      </div>
      <nav class="header-buttons" data-nav="partner-links" aria-label="画面の切り替え"></nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="main-content">
      <section>
        <div class="list-controls">
          <button class="btn btn-primary" onclick="partnerLinksApp.openModal()">➕ 新規リンク発行</button>
          <p class="empty-notice">発行したURLを取引先に共有すると、取引先がいつでも自社案件の進行状況・納品予定日を確認できます(閲覧専用)。案件は「一致パターン」が顧客名に含まれるものが自動で表示されます。</p>
        </div>

        <!-- 配布URLの基準アドレスが未設定のときだけ表示(partner-links.js が制御) -->
        <div id="base-warning" class="base-warning" style="display:none" role="alert"></div>

        <div class="table-container">
          <table class="projects-table" id="links-table">
            <thead>
              <tr>
                <th>取引先名</th>
                <th>専用URL</th>
                <th>一致パターン</th>
                <th>進行中案件</th>
                <th>状態</th>
                <th>発行日</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="links-tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- ===== モーダル: リンク発行・編集 ===== -->
  <div id="link-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="link-modal-title">新規リンク発行</h2>
        <button class="btn-close" onclick="partnerLinksApp.closeModal()" aria-label="閉じる">✕</button>
      </div>
      <form id="link-form" class="project-form">
        <div class="form-group">
          <label for="link-partner-name">取引先名 <span class="req-mark" aria-hidden="true">*</span> <span class="field-hint">(ページに「○○ 様」と表示されます)</span></label>
          <input type="text" id="link-partner-name" maxlength="200" required placeholder="例: 株式会社八木繊維">
        </div>
        <div class="form-group">
          <label for="link-patterns">一致パターン <span class="field-hint">(顧客名にこの文字を含む案件が表示対象。読点「、」区切りで複数可。空欄なら取引先名で一致)</span></label>
          <input type="text" id="link-patterns" maxlength="1000" placeholder="例: 八木繊維、八木せんい">
        </div>
        <div class="form-group">
          <label for="link-notify-emails">受付控えメールの送信先 <span class="field-hint">(加工依頼フォームの送信時に自動返信するアドレス。読点「、」区切りで最大5件。空欄なら自動返信しません)</span></label>
          <input type="text" id="link-notify-emails" maxlength="1000" placeholder="例: tanto1@example.com、tanto2@example.com">
        </div>
        <div class="form-group">
          <label for="link-memo">メモ <span class="field-hint">(社内用。取引先には表示されません)</span></label>
          <input type="text" id="link-memo" maxlength="500" placeholder="例: 担当:○○さん">
        </div>

        <div class="form-errors" id="link-form-errors" hidden role="alert"></div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="partnerLinksApp.closeModal()">キャンセル</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/partner-links.js"></script>
</body>
</html>
