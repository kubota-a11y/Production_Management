<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チームリンク管理 - Production Management</title>
  <!-- 3画面で同一だった .link-url / .status-pill / .size-pills 等は main.css に集約済み -->
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="app-container">
    <!-- ヘッダー(ナビゲーションの中身は js/ui.js が data-nav を見て生成する) -->
    <header class="app-header">
      <div class="header-content">
        <div>
          <h1 class="app-title">🔗 チームリンク管理</h1>
          <p class="app-subtitle">Team Order Links</p>
        </div>
      </div>
      <nav class="header-buttons" data-nav="team-links" aria-label="画面の切り替え"></nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="main-content">
      <section>
        <div class="list-controls">
          <button class="btn btn-primary" onclick="teamLinksApp.openModal()">➕ 新規リンク発行</button>
          <p class="empty-notice">発行したURLをチームのLINEグループ等に共有すると、チームからいつでも追加注文が届きます。シーズン終了時などは「無効化」で即座にアクセスを止められます。</p>
        </div>

        <div class="table-container">
          <table class="projects-table" id="links-table">
            <thead>
              <tr>
                <th>チーム名</th>
                <th>専用URL</th>
                <th>アイテム</th>
                <th>状態</th>
                <th>発行日</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="links-tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- ===== モーダル: リンク発行・編集 ===== -->
  <div id="link-modal" class="modal">
    <div class="modal-content modal-lg">
      <div class="modal-header">
        <h2 id="link-modal-title">新規リンク発行</h2>
        <button class="btn-close" onclick="teamLinksApp.closeModal()" aria-label="閉じる">✕</button>
      </div>
      <form id="link-form" class="project-form">
        <div class="form-row">
          <div class="form-group">
            <label for="link-team-name">チーム名 <span class="req-mark" aria-hidden="true">*</span></label>
            <input type="text" id="link-team-name" maxlength="200" required placeholder="例: ○○FC">
          </div>
          <div class="form-group">
            <label for="link-memo">メモ <span class="field-hint">(社内用。お客様には表示されません)</span></label>
            <input type="text" id="link-memo" maxlength="500" placeholder="例: 2026年度ユニフォーム一式">
          </div>
        </div>

        <div class="form-group">
          <div class="form-label">注文できるアイテム <span class="req-mark" aria-hidden="true">*</span> <span class="field-hint">(参考単価は空欄可。サイズはお客様が選べるものにチェック)</span></div>
          <table class="projects-table" id="link-items-table">
            <thead>
              <tr>
                <th>アイテム名</th>
                <th style="width:120px">参考単価(円)</th>
                <th>サイズ選択肢</th>
                <th style="width:48px"><span class="sr-only">操作</span></th>
              </tr>
            </thead>
            <tbody id="link-items-tbody"></tbody>
          </table>
          <button type="button" class="btn btn-secondary" onclick="teamLinksApp.addItemRow()">＋ アイテムを追加</button>
        </div>

        <div class="form-errors" id="link-form-errors" hidden role="alert"></div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="teamLinksApp.closeModal()">キャンセル</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/team-links.js"></script>
</body>
</html>
