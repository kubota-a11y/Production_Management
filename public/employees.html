<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>従業員マスタ - Production Management</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="app-container">
    <!-- ヘッダー(ナビゲーションの中身は js/ui.js が data-nav を見て生成する) -->
    <header class="app-header">
      <div class="header-content">
        <div>
          <h1 class="app-title">🧑‍🏭 従業員マスタ</h1>
          <p class="app-subtitle">Employee Management</p>
        </div>
      </div>
      <nav class="header-buttons" data-nav="employees" aria-label="画面の切り替え"></nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="main-content">
      <section id="employees-section">
        <div class="list-controls">
          <button class="btn btn-primary" onclick="employeesApp.openEmployeeModal()">
            ➕ 新規従業員
          </button>
          <p class="empty-notice">実際に作業する人の一覧です。勤務パターンと加工別の生産性を持ち、スケジュールボードの割り当て対象になります。案件の窓口になる「担当者マスタ」とは別の一覧です。</p>
        </div>

        <div class="table-container">
          <table class="projects-table" id="employees-table">
            <thead>
              <tr>
                <th>名前</th>
                <th>役割</th>
                <th>ステータス</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="employees-tbody">
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- ===== モーダル: 従業員追加・編集 ===== -->
  <div id="employee-modal" class="modal">
    <div class="modal-content modal-lg">
      <div class="modal-header">
        <h2 id="employee-modal-title">新規従業員</h2>
        <button class="btn-close" onclick="employeesApp.closeEmployeeModal()" aria-label="閉じる">✕</button>
      </div>
      <form id="employee-form" class="project-form">
        <div class="form-row">
          <div class="form-group">
            <label for="emp-name">名前 <span class="req-mark" aria-hidden="true">*</span></label>
            <input type="text" id="emp-name" name="name" required>
          </div>
          <div class="form-group">
            <label for="emp-role">役割 <span class="req-mark" aria-hidden="true">*</span></label>
            <select id="emp-role" name="role" required>
              <option value="FULL_TIME">フルタイム</option>
              <option value="PART_TIME">パート</option>
              <option value="PRODUCTION_MANAGER">生産管理</option>
              <option value="DESIGNER">デザイナー</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="schedule-day-checkbox">
            <input type="checkbox" name="is_active" checked> 有効
          </label>
        </div>

        <fieldset class="form-group">
          <legend>得意スキル <span class="field-hint">(対応可能な加工種別、複数選択可)</span></legend>
          <div class="checkbox-group">
            <label class="checkbox-pill"><input type="checkbox" name="skill_tags" value="SILK_SCREEN_PRINT"> シルクスクリーンプリント</label>
            <label class="checkbox-pill"><input type="checkbox" name="skill_tags" value="DTF_PRINT"> DTFプリント</label>
            <label class="checkbox-pill"><input type="checkbox" name="skill_tags" value="RUBBER_TRANSFER_PRINT"> ラバー転写プリント</label>
            <label class="checkbox-pill"><input type="checkbox" name="skill_tags" value="SUBLIMATION_PRINT"> 昇華プリント</label>
            <label class="checkbox-pill"><input type="checkbox" name="skill_tags" value="STANDARD_EMBROIDERY"> 通常刺繍</label>
            <label class="checkbox-pill"><input type="checkbox" name="skill_tags" value="HAT_EMBROIDERY"> 帽子刺繍</label>
            <label class="checkbox-pill"><input type="checkbox" name="skill_tags" value="PATCH_EMBROIDERY"> ワッペン刺繍</label>
          </div>
        </fieldset>

        <div class="form-group">
          <div class="form-label">曜日ごとの標準勤務パターン</div>
          <table class="projects-table default-schedule-table" id="default-schedule-table">
            <thead>
              <tr>
                <th>曜日</th>
                <th>勤務</th>
                <th>開始</th>
                <th>終了</th>
                <th>休憩(分)</th>
                <th>準備・フォロー予約(時間)</th>
              </tr>
            </thead>
            <tbody id="default-schedule-tbody">
            </tbody>
          </table>
        </div>

        <div class="form-group">
          <div class="form-label">作業別生産性(1時間あたり処理数)</div>
          <table class="projects-table default-schedule-table" id="process-rate-table">
            <thead>
              <tr>
                <th>加工種別</th>
                <th>1時間あたり処理数</th>
              </tr>
            </thead>
            <tbody id="process-rate-tbody">
            </tbody>
          </table>
        </div>

        <!-- 勤務パターンと生産性の表で縦に長くなるため、保存ボタンは下端に固定する -->
        <div class="form-actions form-actions-sticky">
          <button type="button" class="btn btn-secondary" onclick="employeesApp.closeEmployeeModal()">
            キャンセル
          </button>
          <button type="submit" class="btn btn-primary">
            保存
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- スクリプト -->
  <script src="js/ui.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/employees.js"></script>
</body>
</html>
