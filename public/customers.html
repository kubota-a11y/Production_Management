<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顧客台帳 - Production Management</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="app-container">
    <!-- ヘッダー(ナビゲーションの中身は js/ui.js が data-nav を見て生成する) -->
    <header class="app-header">
      <div class="header-content">
        <div>
          <h1 class="app-title">📇 顧客台帳</h1>
          <p class="app-subtitle">Customer Directory</p>
        </div>
      </div>
      <nav class="header-buttons" data-nav="customers" aria-label="画面の切り替え"></nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="main-content">
      <!-- 顧客一覧 -->
      <section id="customer-list-section">
        <div class="delivery-search-bar">
          <label for="customer-search" class="sr-only">顧客名で検索</label>
          <input type="search" id="customer-search" placeholder="🔍 顧客名で検索">
          <span id="customer-search-count" class="delivery-search-count"></span>
        </div>

        <!-- 並び替え・絞り込み -->
        <div class="customer-filter-bar">
          <label for="customer-sort-key">
            並び替え
            <select id="customer-sort-key">
              <option value="default">既定(最近やりとりした順)</option>
              <option value="project_count">取引案件数</option>
              <option value="total_quantity">取引数量</option>
              <option value="last_delivered_date">最終納品</option>
            </select>
          </label>
          <label for="customer-sort-order">
            順序
            <select id="customer-sort-order">
              <option value="desc">多い順(新しい順)</option>
              <option value="asc">少ない順(古い順)</option>
            </select>
          </label>
          <label for="customer-process-filter">
            加工種別
            <select id="customer-process-filter">
              <option value="">すべて</option>
              <option value="SILK_SCREEN_PRINT">シルクスクリーンプリント</option>
              <option value="DTF_PRINT">DTFプリント</option>
              <option value="RUBBER_TRANSFER_PRINT">ラバー転写プリント</option>
              <option value="SUBLIMATION_PRINT">昇華プリント</option>
              <option value="STANDARD_EMBROIDERY">通常刺繍</option>
              <option value="HAT_EMBROIDERY">帽子刺繍</option>
              <option value="PATCH_EMBROIDERY">ワッペン刺繍</option>
            </select>
          </label>
          <button type="button" class="btn btn-small" onclick="customersApp.resetFilters()">条件をクリア</button>
        </div>

        <div class="table-container">
          <table class="projects-table" id="customer-table">
            <thead>
              <tr>
                <th>顧客名</th>
                <th>案件数</th>
                <th>納品済み</th>
                <th>累計数量</th>
                <th>初回受付</th>
                <th>最終納品</th>
                <th>加工種別</th>
                <th>メモ</th>
              </tr>
            </thead>
            <tbody id="customer-tbody"></tbody>
          </table>
        </div>
      </section>

      <!-- 顧客詳細 -->
      <section id="customer-detail-section" style="display:none;">
        <div class="customer-detail-toolbar">
          <button type="button" class="btn btn-small" onclick="customersApp.backToList()">← 顧客一覧へ戻る</button>
          <h2 id="detail-customer-name"></h2>
          <span id="detail-customer-summary" class="delivery-search-count"></span>
        </div>

        <!-- 顧客メモ -->
        <div class="customer-note-card">
          <h3>📝 顧客メモ</h3>
          <form id="customer-note-form" class="project-form">
            <div class="form-row">
              <div class="form-group">
                <label for="note-contact-person">担当窓口</label>
                <input type="text" id="note-contact-person" name="contact_person" placeholder="例: 監督の◯◯さん / 総務◯◯様">
              </div>
              <div class="form-group">
                <label for="note-contact-info">連絡先</label>
                <input type="text" id="note-contact-info" name="contact_info" placeholder="例: LINE / 電話 / メール など連絡手段のメモ">
              </div>
            </div>
            <div class="form-group">
              <label for="note-memo">メモ(値引きルール・注意点・好みなど)</label>
              <textarea id="note-memo" name="memo" rows="3"></textarea>
            </div>
            <div class="form-actions">
              <span class="note-save-status" id="note-save-status" role="status"></span>
              <button type="submit" class="btn btn-primary">メモを保存</button>
            </div>
          </form>
        </div>

        <!-- 案件履歴 -->
        <div class="table-container">
          <table class="projects-table" id="customer-projects-table">
            <thead>
              <tr>
                <th>案件名</th>
                <th>受付日</th>
                <th>ステータス</th>
                <th>納品日</th>
                <th>加工</th>
                <th>数量</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="customer-projects-tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- リピート注文(複製)モーダル(納品履歴ページと同じ挙動) -->
  <div id="duplicate-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>↻ この案件をもとに新規作成</h2>
        <button class="btn-close" onclick="customersApp.closeDuplicateModal()" aria-label="閉じる">✕</button>
      </div>
      <form id="duplicate-form" class="project-form">
        <p class="empty-notice" id="duplicate-source-info"></p>
        <div class="form-group">
          <label for="dup-project-name">案件名 <span class="req-mark" aria-hidden="true">*</span></label>
          <input type="text" id="dup-project-name" name="project_name" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="dup-deadline">納期 <span class="req-mark" aria-hidden="true">*</span></label>
            <input type="date" id="dup-deadline" name="deadline" required>
          </div>
          <div class="form-group">
            <label for="dup-quantity">数量 <span class="req-mark" aria-hidden="true">*</span></label>
            <input type="number" id="dup-quantity" name="quantity" min="1" required>
          </div>
        </div>
        <p class="empty-notice">顧客名・加工内容・プリント箇所・NASのデザインフォルダは元の案件から引き継がれます。担当者と作業計画は引き継がないため、登録後にHiBoardの画面で設定してください。</p>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="customersApp.closeDuplicateModal()">キャンセル</button>
          <button type="submit" class="btn btn-primary">複製して登録</button>
        </div>
      </form>
    </div>
  </div>

  <!-- スクリプト -->
  <script src="js/ui.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nas-browse.js"></script>
  <script src="js/case-detail.js"></script>
  <script src="js/customers.js"></script>
</body>
</html>
